name: File Operations Test
description: Test basic file create, read, and edit operations
scenarios:
  - name: Basic File Operations 111
    steps:
      - input: Please create a file called test-output.txt with content 'This is a test file created by opencode'
        expected:
          - should_produce_file: test-output.txt
          - should_call_tool: write
      - input: Now read the test-output.txt file and tell me what it contains
        expected:
          - should_call_tool: read
          - file_content_contains:
              file: test-output.txt
              text: This is a test file created by opencode
          - response_contains: This is a test file created by opencode
      - input: "Please modify test-output.txt to add a second line: 'This is the second line'"
        expected:
          - should_call_tool: edit
          - file_content_contains:
              file: test-output.txt
              text: This is the second line
    environment: default
    cleanup: true
environments:
  default:
    directory: ../fixtures/empty
      # ↑ 请确保该目录存在。如需空白环境，创建空目录即可；如需预置文件，在目录中放置初始文件。
config:
  default_timeout: 120000
  parallel: false
  agent_cli:
    runner: opencode
    command: opencode
  judges:
    default:
      # ↑ 请填写 judge 配置，例如（请根据实际需要修改或删除）:
      # default:
      #   runner: opencode
      #   command: opencode
      #   model: your-model
      #   agent: plan
      runner: opencode
      command: opencode
