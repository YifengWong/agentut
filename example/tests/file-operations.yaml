name: file-operations-test
description: 验证文件操作 Skill 的基本行为

environments:
  empty:
    directory: ../fixtures/empty
    setup:
      - copy: "../skills/file-operations/ -> $WORKDIR/.opencode/skills/file-operations/"

  with-hello:
    directory: ../fixtures/with-hello
    setup:
      - copy: "../fixtures/templates/hello.txt -> $WORKDIR/hello.txt"
      - copy: "../skills/file-operations/ -> $WORKDIR/.opencode/skills/file-operations/"

scenarios:
  # 场景 1：创建文件（验证 Mock 功能 + 工具调用）
  - name: create-file
    environment: empty
    initial_session: ".agentut/my_test_init_session.json"
    steps:
      - input: "使用 'file-operations' 技能，创建 hello.txt 文件，内容为 'Hello World'。再使用mkdir temp命令创建一个temp目录"
        mock:
          - tool: write
            when:
              - file_path: { contains: "hello.txt" }
            output: "file written successfully (mocked)"
          - tool: bash
            when:
              - command: { contains: "mkdir" }
            output: "directory created (mocked)"
        expected:
          - should_call_tool: Write
          - should_call_tool:
              name: Skill
              input:
                name: file-operations
              status: completed
          - judged_by:
              judge: simple-judge
              prompt: "检查 Agent 的响应输出是否正确使用了 file-operations 技能来完成创建文件的任务，包括调用了 Skill 和 Write 工具"

  # 场景 2：读取文件（验证 Read + 响应内容）
  - name: read-file
    environment: with-hello
    cleanup: true
    steps:
      - input: "使用 'file-operations' 技能，读取 hello.txt 文件内容"
        expected:
          - should_call_tool: Read
          - should_call_tool:
              name: Skill
              input:
                name: { equals: "file-operations" }
              status: completed
          - response_contains: "Hello"
          - exec_command:
              command: "node -v"
              expect: { contains: "24" }

  # 场景 3：多步骤串联（先创建再读取）
  - name: create-then-read
    environment: empty
    cleanup: true
    steps:
      - input: "使用 'file-operations' 技能，创建 hello.txt 文件，内容为 'Test Content'"
        expected:
          - should_call_tool: Write
          - should_produce_file: hello.txt
          - should_call_tool:
              name: Skill
              input:
                name: { equals: "file-operations" }
              status: completed

      - input: "读取 hello.txt 文件"
        expected:
          - should_call_tool: Read
          - response_contains: "Test Content"

config:
  runs: 1
  min_pass: 1
  agent_cli:
    runner: opencode      # Agent 类型 (opencode, claude, gemini)
    command: opencode       # 实际执行的 CLI 命令名
    model: deepseek/deepseek-v4-flash
  judges:
    simple-judge:
      runner: opencode
      command: opencode
      model: deepseek/deepseek-v4-flash
      agent: plan
  default_timeout: 60000
  parallel: false