name: file-operations-with-score
description: 验证文件操作 Skill 的基本行为（含场景评分）

environments:
  empty:
    directory: ../fixtures/empty
    setup:
      - copy: "../skills/file-operations/ -> $WORKDIR/.opencode/skills/file-operations/"

  with-hello:
    directory: ../fixtures/with-hello
    setup:
      - copy: "../fixtures/templates/hello.txt -> $WORKDIR/hello.txt"
      - copy: "../skills/file-operations/ -> $WORKDIR/.opencode/skills/file-operations/"

scenarios:
  # 场景 1：创建文件 — AI 裁判评分
  - name: create-file
    environment: empty
    initial_session: ".agentut/my_test_init_session.json"
    score:
      judge: simple-judge
      prompt: "检查测试产物的整体质量：1) hello.txt 文件是否成功创建且内容为 'Hello World'；2) 文件操作流程是否正确（先激活 file-operations 技能，再使用 Write 工具）；3) 整体执行是否完整无遗漏"
      priority: 10
      min_score: 60
    steps:
      - input: "使用 'file-operations' 技能，创建 hello.txt 文件，内容为 'Hello World'。"
        expected:
          - should_call_tool: Write
          - should_produce_file: hello.txt
          - should_call_tool:
              name: Skill
              input:
                name: file-operations
              status: completed
          - file_content_contains:
              file: hello.txt
              text: "Hello World"
          - judged_by:
              judge: simple-judge
              prompt: "检查是否成功创建了 hello.txt 文件，且内容包含 'Hello World'"

  # 场景 2：读取文件 — 默认断言评分（不配置 score）
  - name: read-file
    environment: with-hello
    cleanup: true
    steps:
      - input: "使用 'file-operations' 技能，读取 hello.txt 文件内容"
        expected:
          - should_call_tool: Read
          - should_call_tool:
              name: Skill
              input:
                name: { equals: "file-operations" }
              status: completed
          - response_contains: "Hello"
          - exec_command:
              command: "node -v"
              expect: { contains: "24" }

  # 场景 3：多步骤串联 — AI 裁判评分（高权重）
  - name: create-then-read
    environment: empty
    cleanup: true
    score:
      judge: simple-judge
      prompt: "检查多步骤串联工作流的整体质量：1) 第一步是否正确创建了 hello.txt 且内容为 'Test Content'；2) 第二步是否正确读取了 hello.txt 并返回了 'Test Content'；3) 两步之间的衔接是否流畅无误"
      priority: 15
      min_score: 60
    steps:
      - input: "使用 'file-operations' 技能，创建 hello.txt 文件，内容为 'Test Content'"
        expected:
          - should_call_tool: Write
          - should_produce_file: hello.txt
          - should_call_tool:
              name: Skill
              input:
                name: { equals: "file-operations" }
              status: completed

      - input: "读取 hello.txt 文件"
        expected:
          - should_call_tool: Read
          - response_contains: "Test Content"

config:
  runs: 1
  min_pass: 1
  agent_cli:
    runner: opencode
    command: opencode
    model: deepseek/deepseek-v4-flash
  judges:
    simple-judge:
      runner: opencode
      command: opencode
      model: deepseek/deepseek-v4-flash
      agent: plan
  default_timeout: 300000
  parallel: false
